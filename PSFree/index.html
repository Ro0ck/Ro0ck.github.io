<html>

        <style>
            @font-face {
                font-family: 'logging';
                src: url('fonts/LiberationMono-Regular.ttf');
            }
            body {
                background: #10131a;
                color: #e0e0e0;
                font-family: 'Segoe UI', 'Arial', 'sans-serif';
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                overflow-x: hidden;
            }
            /* Animated cyberpunk grid background */
            body::before {
                content: '';
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                z-index: 0;
                background: repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 80px),
                            repeating-linear-gradient(0deg, #222 0 2px, transparent 2px 80px),
                            linear-gradient(120deg, #00ffe7 0%, #ff6a00 100%);
                opacity: 0.13;
                animation: gridmove 8s linear infinite;
            }
            @keyframes gridmove {
                0% { background-position: 0 0, 0 0, 0 0; }
                100% { background-position: 80px 80px, 80px 80px, 0 0; }
            }
            h1, .title {
                color: #00ffe7;
                text-shadow: 0 0 16px #00ffe7, 0 0 32px #005a7a, 0 0 8px #ff6a00;
                font-size: 2.5em;
                margin-top: 48px;
                margin-bottom: 18px;
                letter-spacing: 3px;
                font-family: 'Orbitron', 'Segoe UI', 'Arial', 'sans-serif';
                position: relative;
                z-index: 1;
                animation: glowTitle 2.5s infinite alternate;
            }
            @keyframes glowTitle {
                0% { text-shadow: 0 0 16px #00ffe7, 0 0 32px #005a7a, 0 0 8px #ff6a00; }
                100% { text-shadow: 0 0 32px #00ffe7, 0 0 64px #005a7a, 0 0 16px #ff6a00; }
            }
            .bo6-logo {
                display: none;
            }
            #runExploitBtn {
                background: linear-gradient(90deg, #ff6a00 0%, #ffb347 100%);
                color: #10131a;
                border: none;
                border-radius: 8px;
                font-size: 1.2em;
                font-weight: bold;
                padding: 12px 32px;
                margin-bottom: 24px;
                margin-top: 12px;
                box-shadow: 0 0 12px #ff6a00a0;
                cursor: pointer;
                transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            }
            #runExploitBtn:hover {
                background: linear-gradient(90deg, #00ffe7 0%, #005a7a 100%);
                color: #fff;
                box-shadow: 0 0 18px #00ffe7a0;
            }
            #console {
                font-family: 'logging', 'Consolas', 'monospace';
                background: #181c24;
                color: #00ffe7;
                border-radius: 8px;
                padding: 18px;
                margin-top: 18px;
                min-width: 320px;
                min-height: 120px;
                box-shadow: 0 0 8px #005a7a80;
                font-size: 1.1em;
            }
            a {
                color: #ffb347;
                text-decoration: underline;
            }
            a:hover {
                color: #00ffe7;
            }
            /* Neon border for main content */
            .main-content {
                background: rgba(16,19,26,0.85);
                border-radius: 18px;
                box-shadow: 0 0 32px #00ffe7a0, 0 0 16px #ff6a00a0;
                border: 2.5px solid #ff6a00;
                padding: 32px 36px 24px 36px;
                margin-top: 36px;
                margin-bottom: 36px;
                position: relative;
                z-index: 1;
                max-width: 600px;
            }
            /* Add a cyberpunk scanline effect */
            body::after {
                content: '';
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                pointer-events: none;
                z-index: 2;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(0,255,231,0.03) 0px,
                    rgba(0,255,231,0.01) 2px,
                    transparent 4px,
                    transparent 8px
                );
                mix-blend-mode: lighten;
            }
        </style>
        <script>
