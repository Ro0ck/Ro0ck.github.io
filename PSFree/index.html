<html>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>PSFree-Lapse Exploit For PS4 9.00</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <style>
            @font-face {
                font-family: 'logging';
                src: url('fonts/LiberationMono-Regular.ttf');
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #000000 url('bos.jpg') no-repeat center center fixed;
                background-size: cover;
                color: #e4e4e7;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
                position: relative;
                overflow-x: hidden;
            }

            .main-content {
                background: rgba(15, 15, 15, 0.95);
                border: 1px solid #ff7800;
                border-radius: 8px;
                padding: 40px 35px;
                max-width: 450px;
                width: 100%;
                position: relative;
                z-index: 1;
                box-shadow: 0 0 30px rgba(255, 120, 0, 0.25);
            }

            .title {
                font-size: 2rem;
                font-weight: 700;
                text-align: center;
                margin-bottom: 8px;
                background: linear-gradient(135deg, #ff9500 0%, #ff6600 50%, #ff4400 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                text-shadow: 0 0 30px rgba(255, 120, 0, 0.5);
            }

            .subtitle {
                text-align: center;
                color: #666;
                font-size: 0.85rem;
                margin-bottom: 32px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            #runExploitBtn {
                width: 100%;
                background: linear-gradient(135deg, #ff7800 0%, #ff5500 100%);
                color: #000000;
                border: none;
                border-radius: 2px;
                font-family: 'Inter', sans-serif;
                font-size: 1rem;
                font-weight: 700;
                padding: 16px 32px;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 
                    0 0 20px rgba(255, 120, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.2);
                position: relative;
                overflow: hidden;
                text-transform: uppercase;
                letter-spacing: 0.15em;
            }

            #runExploitBtn::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
                transition: left 0.4s;
            }

            #runExploitBtn:hover {
                background: linear-gradient(135deg, #ff9000 0%, #ff6600 100%);
                box-shadow: 
                    0 0 30px rgba(255, 120, 0, 0.6),
                    0 0 60px rgba(255, 100, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3);
            }

            #runExploitBtn:hover::before {
                left: 100%;
            }

            #runExploitBtn:focus {
                outline: 2px solid #ff9500;
                outline-offset: 3px;
            }

            #runExploitBtn:active {
                transform: scale(0.98);
            }

            .console-container {
                margin-top: 24px;
            }

            .console-header {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 12px;
            }

            .console-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #ff7800;
                box-shadow: 0 0 8px rgba(255, 120, 0, 0.6);
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }

            .console-label {
                font-size: 0.75rem;
                font-weight: 500;
                color: #666;
                text-transform: uppercase;
                letter-spacing: 0.1em;
            }

            #console {
                font-family: 'JetBrains Mono', 'logging', 'Consolas', monospace;
                background: rgba(0, 0, 0, 0.8);
                color: #ff9500;
                border: 1px solid rgba(255, 120, 0, 0.2);
                border-radius: 2px;
                padding: 16px;
                width: 100%;
                min-height: 150px;
                max-height: 300px;
                font-size: 0.85rem;
                line-height: 1.6;
                overflow-x: hidden;
                overflow-y: auto;
                word-wrap: break-word;
                word-break: break-word;
                white-space: pre-wrap;
                box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            }

            #console::-webkit-scrollbar {
                width: 6px;
            }

            #console::-webkit-scrollbar-track {
                background: transparent;
            }

            #console::-webkit-scrollbar-thumb {
                background: rgba(255, 120, 0, 0.3);
                border-radius: 2px;
            }

            #console::-webkit-scrollbar-thumb:hover {
                background: rgba(255, 120, 0, 0.5);
            }

            .footer-link {
                margin-top: 24px;
                text-align: center;
                font-size: 0.8rem;
            }

            a {
                color: #ff7800;
                text-decoration: none;
                transition: color 0.2s;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            a:hover {
                color: #ff9500;
                text-shadow: 0 0 10px rgba(255, 120, 0, 0.5);
            }

            /* Responsive */
            @media (max-width: 480px) {
                .main-content {
                    padding: 32px 24px;
                    border-radius: 20px;
                }
                
                .title {
                    font-size: 1.4rem;
                }

                #console {
                    font-size: 0.8rem;
                    min-height: 120px;
                }
            }
        </style>
        <script>
        if (window.applicationCache.status=='0')
        {
          window.location.replace("cache.html");
        }
        </script>
    </head>
    <body>
        <div class="main-content">
            <div class="title">PSFree</div>
            <div class="subtitle">PS4/PS5 Exploit Chain</div>
            
            <button id="runExploitBtn" autofocus>▶ Run Exploit</button>
            
            <div class="console-container">
                <div class="console-header">
                    <div class="console-dot"></div>
                    <span class="console-label">Console Output</span>
                </div>
                <pre id='console'></pre>
            </div>
        </div>
        
        <script type='module'>
            // Focus on button when page loads
            window.addEventListener('load', () => {
                document.getElementById('runExploitBtn').focus();
            });
            
            document.getElementById('runExploitBtn').addEventListener('click', async () => {
                // Dynamically import alert.mjs, which will load and run the exploit
                await import('./alert.mjs');
            });
        </script>
    </body>
</html>
